input {
  # приём логов от filebeat
  beats {
    port => 5044
  }

  # приём json-сообщений по tcp (требование задания)
  tcp {
    port => 5000
    codec => json_lines
  }
}

filter {
  # помечаем источник, чтобы отличать beats от tcp в Discover
  if [agent][type] == "filebeat" {
    mutate {
      add_field => { "log_source" => "filebeat-docker" }
    }
  } else {
    mutate {
      add_field => { "log_source" => "tcp-json" }
    }
  }
}

output {
  elasticsearch {
    hosts => ["http://es-hot:9200"]
    index => "logstash-%{+YYYY.MM.dd}"
  }

  # ВАЖНО: вывод в stdout намеренно отключён.
  # filebeat читает docker-логи всех контейнеров, включая сам logstash,
  # поэтому stdout создаёт петлю обратной связи с лавинообразным ростом объёма.
  # Для отладки временно раскомментировать и следить за размером логов:
  # stdout { codec => rubydebug }
}
